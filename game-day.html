<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0055A4">
<title>Game Day — Tournament Guide</title><style>
  :root{
    --su:#0055A4; --su-dark:#003f7a; --su-soft:#e8f0fb;
    --link:#0a66c2; --bg:#eef1f6; --card:#ffffff;
    --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e6ec;
    --green:#1a9e4a; --green-bg:#e8f6ee;
    --amber:#b76e00; --amber-bg:#fff3d6;
    --red:#d72d2d; --red-bg:#fdecec;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);line-height:1.45}
  .app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:76px;position:relative}
  .num{font-family:"SF Pro Display","Segoe UI",system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .hero{background:linear-gradient(160deg,var(--su) 0%,var(--su-dark) 100%);color:#fff;padding:22px 18px 18px;position:relative;overflow:hidden}
  .hero .kick{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#cfe0f5;margin:0 0 3px;font-weight:600}
  .hero h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.4px}
  .hero .team{font-size:13.5px;color:#fff;opacity:.92;margin:3px 0 0;font-weight:600}
  .hero .meta{font-size:12.5px;color:#cfe0f5;margin:7px 0 0;letter-spacing:.3px}
  .hero .crest{position:absolute;right:-18px;top:-18px;width:120px;height:120px;opacity:.10;pointer-events:none}
  .hero .crest svg{width:100%;height:100%}

  /* CONTEXT STRIP + COUNTDOWN */
  .context{background:var(--su);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .context .chip{background:rgba(255,255,255,.16);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .countdown{background:var(--su-dark);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .countdown .cd-label{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#cfe0f5;width:100%;text-align:center}
  .countdown .cd-num{font-size:24px;font-weight:800;letter-spacing:-1px}
  .countdown .cd-unit{font-size:10px;font-weight:700;color:#cfe0f5;text-transform:uppercase;letter-spacing:.4px}
  .countdown .cd-sep{color:#cfe0f5;opacity:.6;font-weight:800}

  /* PROVENANCE LEGEND */
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 18px;background:var(--bg);font-size:10.5px;color:var(--muted);font-weight:600}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.b{background:var(--link)}

  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);z-index:50}
  .nav-inner{max-width:520px;margin:0 auto;display:flex;height:60px}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:600}
  .nav a svg{width:22px;height:22px}
  .nav a.on{color:var(--su)}
  .nav a.on svg{stroke:var(--su)}

  .screen{display:none;padding:14px 14px 20px}
  .screen.on{display:block}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .muted{color:var(--muted);font-size:13px}.small{font-size:12px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .section-title{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--su);margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
  .section-title svg{width:16px;height:16px;stroke:var(--su)}

  /* NEXT MATCH DASHBOARD */
  .next{border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;border-top:5px solid var(--su)}
  .next .head{background:var(--su-soft);padding:9px 16px;display:flex;justify-content:space-between;align-items:center}
  .next .head .who{font-size:12px;font-weight:800;color:var(--su);letter-spacing:.3px;text-transform:uppercase}
  .next .head .status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
  .status.conf{background:var(--green-bg);color:var(--green)}
  .status.pend{background:var(--amber-bg);color:var(--amber)}
  .next .body{padding:16px 18px}
  .next .day{font-size:13px;font-weight:800;color:var(--su);text-transform:uppercase;letter-spacing:.6px}
  .next .time{font-size:54px;font-weight:800;letter-spacing:-2.5px;line-height:1;margin:2px 0}
  .next .vs{font-size:17px;font-weight:700;margin:4px 0}
  .next .meta-line{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  .pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;background:var(--su-soft);color:var(--su)}
  .pill.field{background:var(--su);color:#fff}
  .pill.away{background:var(--bg);color:var(--muted)}
  .next .arrive{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
  .next .arrive b{color:var(--ink)}
  .next .arrive .pend{color:var(--amber);font-weight:600}
  .next .wx-mini{margin-top:10px;padding:10px 12px;background:var(--amber-bg);border-radius:10px;font-size:12.5px;font-weight:600;color:var(--amber);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .next .wx-mini .exp{color:var(--link);font-weight:700;white-space:nowrap}

  .btn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:13px 6px;border-radius:12px;background:var(--su);color:#fff;text-decoration:none;font-size:11px;font-weight:700;text-align:center}
  .btn svg{width:22px;height:22px}
  .btn.ghost{background:var(--su-soft);color:var(--su)}

  .wx-full{display:none}
  .wx-full.open{display:block}
  .wx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wxcard{border-radius:14px;padding:14px;color:#fff}
  .wxcard .wd{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
  .wxcard .wt{font-size:34px;font-weight:800;letter-spacing:-1.5px;margin:2px 0 0}
  .wxcard .wf{font-size:12px;font-weight:600;opacity:.9;margin-bottom:8px}
  .wxcard .wrow{font-size:11.5px;display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid rgba(255,255,255,.18)}
  .wxcard .wrow b{font-weight:700}

  .watch{border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
  .watch .wh{background:var(--su-dark);color:#fff;padding:9px 14px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
  .watch .wh svg{width:16px;height:16px}
  .watch .wb{display:grid;background:var(--card)}
  .watch .wcell{padding:13px 14px;border-bottom:1px solid var(--line)}
  .watch .wcell:last-child{border-bottom:none}
  .watch .wcell .wt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .watch .wcell .wv{font-size:24px;font-weight:800;letter-spacing:-1px;margin:2px 0}
  .watch .wcell .ws{font-size:11px;color:var(--muted)}
  .watch .wfoot{background:var(--card);border-top:1px solid var(--line);padding:9px 14px;text-align:center}
  .watch .wfoot a{color:var(--link);font-weight:700;text-decoration:none;font-size:12.5px}

  .need{border-radius:16px;padding:15px 16px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow);background:linear-gradient(150deg,#0055A4,#003f7a)}
  .need .nh{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.85;display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .need .nh svg{width:15px;height:15px}
  .need ul{margin:0;padding:0;list-style:none}
  .need li{font-size:13.5px;font-weight:600;padding:4px 0;display:flex;align-items:center;gap:9px}
  .need li::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;opacity:.6;flex-shrink:0}

  .daycard{border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px}
  .daycard .dh{padding:11px 16px;color:#fff;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .daycard .dh .dd{font-size:11px;font-weight:600;opacity:.85}
  .daycard .g{padding:14px 16px;border-top:1px solid var(--line)}
  .daycard .g:first-of-type{border-top:none}
  .g .grow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .g .gtime{font-size:24px;font-weight:800;letter-spacing:-1px}
  .g .gvs{font-size:13.5px;font-weight:600}
  .g .gmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .g .ghome{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .gap{border-left:3px solid var(--amber);background:var(--amber-bg);padding:9px 14px;font-size:12px;color:var(--amber);font-weight:700;display:flex;align-items:center;gap:7px}
  .gap svg{width:16px;height:16px}
  .final{border:2px dashed var(--amber);background:var(--amber-bg);border-radius:14px;padding:13px 16px;margin-top:2px}
  .final .ftag{font-size:11px;font-weight:800;color:var(--amber);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .final .ftag svg{width:15px;height:15px}
  .final .ftime{font-size:24px;font-weight:800;letter-spacing:-1px;margin:3px 0}
  .final .fnote{font-size:12px;color:var(--amber);margin-top:4px}

  .ourwk{display:flex;align-items:center;gap:6px;justify-content:center;padding:12px;background:var(--su);border-radius:12px;color:#fff;margin-top:12px}
  .ourwk .ow{font-size:13px;font-weight:800}
  .ourwk .owl{font-size:10px;opacity:.85;font-weight:600}
  .ourwk .arr{font-size:16px;opacity:.7}

  .tap{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
  .tap:last-child{border-bottom:none}
  .tap .ic{width:40px;height:40px;border-radius:12px;background:var(--su-soft);color:var(--su);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .tap .ic svg{width:21px;height:21px}
  .tap .tt{flex:1}
  .tap .tt .tl{font-size:14px;font-weight:700}
  .tap .tt .ts{font-size:12px;color:var(--muted)}
  .tap .dist{font-size:12px;font-weight:700;color:var(--link);text-align:right;flex-shrink:0}
  .tap .dist .d{display:block;font-size:9px;color:var(--muted);font-weight:600}

  .amenities{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .amenity{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600}
  .amenity svg{width:17px;height:17px;color:var(--green);stroke:var(--green)}

  .tl{position:relative;padding-left:26px;margin-top:6px}
  .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tlstep{position:relative;padding:6px 0 6px 6px}
  .tlstep::before{content:"";position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--su);border:2px solid #fff;box-shadow:0 0 0 2px var(--su)}
  .tlstep .tt{font-size:13px;font-weight:700}
  .tlstep .ts{font-size:12px;color:var(--muted)}
  .tlstep .tk{font-size:11px;font-weight:800;color:var(--su)}

  .chkgrp{margin-bottom:14px}
  .chkgrp h4{margin:0 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--su)}
  .chk{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
  .chk:last-child{border-bottom:none}
  .chk .box{width:24px;height:24px;border-radius:7px;border:2px solid #c7cdd6;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .chk.done .box{background:var(--green);border-color:var(--green)}
  .chk.done .box svg{width:15px;height:15px;stroke:#fff}
  .chk.done .chkname{color:var(--muted);text-decoration:line-through}
  .progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 12px}
  .progress i{display:block;height:100%;background:var(--green);transition:width .2s}

  .contact{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .contact:last-child{border-bottom:none}
  .contact .ci{width:40px;height:40px;border-radius:50%;background:var(--su-soft);color:var(--su);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
  .contact .cn{flex:1}
  .contact .cn .cnm{font-size:14px;font-weight:700}
  .contact .cn .crl{font-size:11.5px;color:var(--muted)}
  .contact a{background:var(--su);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:6px 12px;border-radius:9px;flex-shrink:0}

  .quickrules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qr{background:var(--bg);border-radius:10px;padding:10px 12px}
  .qr .qrv{font-size:14px;font-weight:800}
  .qr .qrl{font-size:11px;color:var(--muted)}
  details.acc{border-radius:12px;overflow:hidden;margin-top:10px;background:var(--bg)}
  details.acc summary{padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--su);list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.acc summary::-webkit-details-marker{display:none}
  details.acc[open] summary{background:var(--su-soft)}
  details.acc .accbody{padding:4px 14px 14px;font-size:13px}
  .ruleline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .ruleline:last-child{border-bottom:none}
  .ruleline b{font-weight:700;color:var(--su)}

  .updated-banner{background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:12.5px;display:flex;align-items:center;gap:9px}
  .updated-banner svg{width:17px;height:17px;color:var(--link);stroke:var(--link);flex-shrink:0}
  .updated-banner a{color:var(--link);font-weight:700;text-decoration:none}

  .fullguide{border-radius:14px;background:linear-gradient(150deg,var(--su),var(--su-dark));color:#fff;padding:16px;margin-bottom:14px;text-decoration:none;display:block}
  .fullguide .fg1{font-size:14px;font-weight:800;margin-bottom:3px}
  .fullguide .fg2{font-size:12px;opacity:.85;margin-bottom:10px}
  .fullguide .fgb{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700}
  .alert{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
  .alert svg{width:20px;height:20px;flex-shrink:0}
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <div class="crest" aria-hidden="true" id="crestMark"></div>
    <p class="kick" id="heroKick"></p>
    <h1 id="heroTitle"></h1>
    <p class="team" id="heroTeam"></p>
    <p class="meta" id="heroMeta"></p>
  </header>

  <div class="context">
    <span id="ctxText"></span>
    <span class="chip" id="ctxChip"></span>
  </div>

  <!-- LIVE COUNTDOWN -->
  <div class="countdown" id="countdown">
    <span class="cd-label" id="cdLabel"></span>
    <span id="cdBody"></span>
  </div>

  <div class="legend">
    <span><span class="dot g"></span>Confirmed</span>
    <span><span class="dot a"></span>Coach pending</span>
    <span><span class="dot b"></span>Guide recommendation</span>
  </div>

  <main>
    <section class="screen on" id="scr-today">
      <div class="updated-banner" id="updBanner"></div>
      <div class="next">
        <div class="head"><span class="who">Next Match</span><span class="status conf" id="nextStatus"></span></div>
        <div class="body" id="nextBody"></div>
      </div>
      <div class="need">
        <div class="nh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><circle cx="12" cy="12" r="4"/></svg><span id="needTitle"></span></div>
        <ul id="needList"></ul>
      </div>
      <div class="wx-full" id="wxFull"></div>
      <div class="watch" id="watchCard"></div>
    </section>

    <section class="screen" id="scr-schedule">
      <h1 style="font-size:20px;margin:2px 0 4px;font-weight:800">Schedule</h1>
      <p class="muted" id="schedVenueLine" style="margin:0 0 12px"></p>
      <div id="scheduleDays"></div>
      <div id="ourWeekend"></div>
    </section>

    <section class="screen" id="scr-venue">
      <h1 style="font-size:20px;margin:2px 0 4px;font-weight:800">Venue</h1>
      <div id="venueCard"></div>
      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-4 9a3 3 0 0 0 2.6 1.5h6.8A3 3 0 0 0 18 18l-4-9V3"/></svg>Our Fields</div>
      <div id="fieldsCard"></div>
      <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16M5 20v-7M19 20v-7M5 13V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7"/></svg>Parking &amp; Amenities</div>
      <div id="venueInfoCard"></div>
    </section>

    <section class="screen" id="scr-pack">
      <div class="row" style="margin:2px 0 4px">
        <h1 style="font-size:20px;margin:0;font-weight:800">Packing</h1>
        <button onclick="resetPack()" style="border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer">Reset Checklist</button>
      </div>
      <div class="alert" id="packAlert" style="background:var(--su);color:#fff;align-items:center"></div>
      <div class="card" style="padding-bottom:10px">
        <div class="row"><span class="muted small" id="packCount">0 of 0</span><span class="muted small">Saved on this phone</span></div>
        <div class="progress"><i id="packBar" style="width:0%"></i></div>
        <div id="packLists"></div>
      </div>
    </section>

    <section class="screen" id="scr-more">
      <a class="fullguide" id="fullGuideLink" href="#"><div class="fg1" id="fg1"></div><div class="fg2" id="fg2"></div><span class="fgb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg>Open full guide</span></a>
      <div id="breakSection"></div>
      <div id="nearbySection"></div>
      <div id="contactsSection"></div>
      <div id="rulesSection"></div>
      <div id="changesSection"></div>
    </section>
  </main>

  <nav class="nav">
    <div class="nav-inner">
      <a href="#" data-goto="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Today</a>
      <a href="#" data-goto="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Schedule</a>
      <a href="#" data-goto="venue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>Venue</a>
      <a href="#" data-goto="pack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Pack</a>

// ---- TOURNAMENT-AGNOSTIC DATE HELPERS ----
const TZ=TOURNAMENT.timezone;
function tzNow(){return new Date();}
function tzTime(iso){return new Date(iso);}
function fmtParts(diff){
  diff=Math.max(0,diff);
  const days=Math.floor(diff/86400000),hours=Math.floor((diff%86400000)/3600000),mins=Math.floor((diff%3600000)/60000);
  return {days,hours,mins};
}

// ---- LIVE COUNTDOWN (contextual: travel → G1 → G2 → G3 → confirmed final → complete) ----
const cdLabel=document.getElementById('cdLabel'),cdBody=document.getElementById('cdBody');
function nextEvent(now){
  // Build the ordered event list from data
  const events=[];
  if(TOURNAMENT.travel) events.push({type:'travel',t:tzTime(TOURNAMENT.travel.date+"T00:00:00-04:00"),label:'Travel'});
  TOURNAMENT.games.forEach(g=>{
    if(g.status==='confirmed') events.push({type:'game',t:tzTime(g.datetime),game:g,label:g.label});
    else if(g.status==='conditional'&&g.confirmed) events.push({type:'game',t:tzTime(g.datetime),game:g,label:g.label});
  });
  events.sort((a,b)=>a.t-b.t);
  // next upcoming
  for(const e of events){ if(e.t>now) return e; }
  return null; // complete
}
function renderCountdown(){
  const now=tzNow(),ev=nextEvent(now);
  if(!ev){ cdLabel.textContent='Tournament Complete'; cdBody.innerHTML=''; return; }
  const diff=ev.t-now;
  if(ev.type==='travel'){
    cdLabel.textContent='UNTIL TRAVEL';
  } else {
    const g=ev.game;
    const isFirst=TOURNAMENT.games[0]&&g.id===TOURNAMENT.games[0].id;
    cdLabel.textContent='UNTIL '+(isFirst?'KICKOFF':g.label.toUpperCase());
  }
  const p=fmtParts(diff);
  let html;
  if(p.days>0) html='<span class="cd-num num">'+p.days+'</span><span class="cd-unit">d</span><span class="cd-sep">·</span><span class="cd-num num">'+p.hours+'</span><span class="cd-unit">hr</span><span class="cd-sep">·</span><span class="cd-num num">'+p.mins+'</span><span class="cd-unit">min</span>';
  else if(p.hours>0) html='<span class="cd-num num">'+p.hours+'</span><span class="cd-unit">hr</span><span class="cd-sep">·</span><span class="cd-num num">'+p.mins+'</span><span class="cd-unit">min</span>';
  else html='<span class="cd-num num">'+p.mins+'</span><span class="cd-unit">min</span>';
  cdBody.innerHTML=html;
}

// ---- CONTEXT + NEED-NOW (data-driven) ----
const ctxText=document.getElementById('ctxText'),ctxChip=document.getElementById('ctxChip');
const needTitle=document.getElementById('needTitle'),needList=document.getElementById('needList');
function currentPhase(now){
  const travel=TOURNAMENT.travel?tzTime(TOURNAMENT.travel.date+"T00:00:00-04:00"):null;
  const g1=TOURNAMENT.games[0]?tzTime(TOURNAMENT.games[0].datetime):null;
  if(travel&&now<travel) return 'pre';
  if(travel&&now<tzTime(travel.getTime()+24*3600000)) return 'travel';
  if(g1&&now<g1) return 'game1';
  // during/after g1
  for(let i=0;i<TOURNAMENT.games.length;i++){
    const g=TOURNAMENT.games[i];
    if(g.status!=='confirmed')continue;
    const t=tzTime(g.datetime);
    const end=t.getTime()+2*3600000; // ~2hr match window
    if(now>=t&&now<end) return 'game'+(i+1);
  }
  // between games: next upcoming confirmed game
  const next=nextEvent(now);
  if(next&&next.type==='game') return 'between';
  return 'done';
}
function refreshContext(){
  const now=tzNow(),ph=currentPhase(now);
  let txt,chip,need='before';
  const travel=TOURNAMENT.travel;
  const g1=TOURNAMENT.games[0];
  switch(ph){
    case 'pre':
      const days=Math.max(0,Math.round((tzTime(g1.datetime).getTime()-new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime())/86400000));
      const travelWeekday=travel?new Date(travel.date+"T12:00:00-04:00").toLocaleDateString('en-US',{weekday:'long',timeZone:TZ}):'';
      txt=(days>0?days+' DAYS TO KICKOFF':'TODAY · GAME DAY');
      chip=(travel?travel.label+' · '+travelWeekday:'Game Day'); need='before'; break;
    case 'travel': txt='TRAVEL DAY'; chip=travel.detail||travel.label; need='travel'; break;
    case 'game1': txt='GAME DAY'; chip=g1.label+' · '+g1.time; need='game1'; break;
    case 'between': txt='BETWEEN GAMES'; need='between';
      const nxt=nextEvent(now); chip=nxt&&nxt.game?nxt.game.label+' · '+nxt.game.time:'Next match'; break;
    case 'done': txt='TOURNAMENT COMPLETE'; chip='Great weekend!'; need='before'; break;
    default:
      const gi=parseInt(ph.replace('game',''),10)-1;
      const g=TOURNAMENT.games[gi]||g1; txt=(ph==='game1'?'GAME DAY':'FINAL DAY'); chip=g.label+' · '+g.time; need='game1'; break;
  }
  ctxText.textContent=txt; ctxChip.textContent=chip;
  const needKey=need==='travel'?'travel':need==='between'?'between':need==='game1'?'game1':'before';
  const list=(TOURNAMENT.needs[needKey]||TOURNAMENT.needs.before);
  let needTitleText='Before Friday';
  if(need==='between') needTitleText='Between Games';
  else if(need==='travel') needTitleText=(travel?travel.label:'Today');
  else if(need==='game1') needTitleText=(g1?g1.label:'Game 1');
  needTitle.textContent=needTitleText;
  needList.innerHTML=list.map(([a,b])=>'<li>'+a+' <span style="opacity:.75;font-weight:500">· '+b+'</span></li>').join('');
}

    '<div class="btn-row">'+
      '<a class="btn" href="'+venue.mapsUrl+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>Directions</a>'+

document.querySelectorAll('[data-wxopen]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();wxFull.classList.toggle('open');}));

// ---- SCHEDULE ----
function renderSchedule(){
  document.getElementById('schedVenueLine').textContent='All games at '+TOURNAMENT.venue.name+' · '+TOURNAMENT.venue.address+', '+TOURNAMENT.venue.city;
  const byDay={};
  TOURNAMENT.games.forEach(g=>{(byDay[g.dayLabel]=byDay[g.dayLabel]||[]).push(g);});
  let out='';
  for(const [day,games] of Object.entries(byDay)){
    const isSat=day.toLowerCase().includes('saturday');
    out+='<div class="daycard '+(isSat?'sat':'sun')+'"><div class="dh"><span>'+day+'</span><span class="dd">'+games.map(g=>g.label).join(' + ')+'</span></div>';
    games.forEach((g,i)=>{
      if(g.type==='final'){out+='<div class="final"><div class="ftag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/></svg>Potential Final · Not Guaranteed</div><div class="ftime num">'+g.time+'</div><div class="ftag" style="color:var(--su)">'+g.opponent+' · Field '+g.field+'</div><div class="fnote">'+g.note+'</div></div>';return;}
      out+='<div class="g"><div class="ghome">'+(g.home?'Home':'Away')+'</div><div class="grow"><span class="gtime num">'+g.time+'</span><span class="pill field">Field '+g.field+'</span></div><div class="gvs">vs '+g.opponent+'</div></div>';
      // gap between games
      const next=games[i+1];
      if(next&&next.type!=='final'){
        const h=Math.round((tzTime(next.datetime)-tzTime(g.datetime))/3600000);
        if(h>=3) out+='<div class="gap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l3 2"/></svg>'+h+'-hour break</div>';
      }
    });
    out+='</div>';
  }
  document.getElementById('scheduleDays').innerHTML=out;
  // our weekend strip
  if(TOURNAMENT.venue.ourFields&&TOURNAMENT.venue.ourFields.length){
    const cells=TOURNAMENT.venue.ourFields.map(f=>'<div><div class="ow num">'+f.f+'</div><div class="owl">'+f.label+'</div></div>').join('<span class="arr">→</span>');
    document.getElementById('ourWeekend').innerHTML='<div class="ourwk">'+cells+'</div><p class="small muted" style="text-align:center;margin:8px 0 0">Memorize the field order</p>';
  }
}

// ---- VENUE ----
function renderVenue(){
  const v=TOURNAMENT.venue;
  document.getElementById('venueCard').innerHTML='<div class="card" style="border-top:4px solid var(--su)"><div class="label">'+v.name+'</div><div style="font-size:16px;font-weight:700;margin:2px 0 2px">'+v.address+'</div><div class="muted" style="margin-bottom:12px">'+v.city+'</div><a class="btn" style="flex-direction:row;font-size:14px;gap:8px" href="'+v.mapsUrl+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>Directions</a></div>';
  // fields grid
  let grid='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">';
  for(let i=1;i<=v.fieldCount;i++){
    const our=v.ourFields.find(f=>f.f===i);
    if(our) grid+='<div style="aspect-ratio:4/3;border-radius:10px;background:var(--su);border:3px solid var(--su-dark);box-shadow:0 2px 8px rgba(0,85,164,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;line-height:1.1">'+i+'<span style="font-size:8px;font-weight:700;opacity:.9;letter-spacing:.3px">'+our.label+'</span></div>';
    else grid+='<div style="aspect-ratio:4/3;border-radius:10px;background:var(--bg);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#c3c9d1">'+i+'</div>';
  }
  grid+='</div><div class="ourwk" style="margin-top:14px">';
  grid+=v.ourFields.map(f=>'<div><div class="ow num">'+f.f+'</div><div class="owl">'+f.label+'</div></div>').join('<span class="arr">→</span>');
  grid+='</div><p class="small" style="margin:10px 0 0;text-align:center;color:var(--su);font-weight:800;letter-spacing:.5px">'+v.ourFields.map(f=>f.f).join(' → ')+'</p>';
  grid+='<a class="btn ghost" style="margin-top:10px;flex-direction:row;gap:7px" href="'+v.fieldMapUrl+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-4 9a3 3 0 0 0 2.6 1.5h6.8A3 3 0 0 0 18 18l-4-9V3"/></svg>Official field map</a>';
  document.getElementById('fieldsCard').innerHTML=grid;
  // amenities
  const amen=v.amenities.map(a=>'<div class="amenity"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/></svg>'+a+'</div>').join('');
  document.getElementById('venueInfoCard').innerHTML='<div class="card"><div class="tap"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16M5 20v-7M19 20v-7M5 13V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7"/></svg></span><div class="tt"><div class="tl">Parking</div><div class="ts">'+v.parking+'</div></div></div><div class="amenities" style="margin-top:12px">'+amen+'</div><p class="small muted" style="margin:12px 0 0">'+v.bring+'</p></div>';
}

  document.getElementById('breakSection').innerHTML='<div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+b.title+'</div><div class="card"><p class="small muted" style="margin:0 0 8px">'+b.intro+'</p><div class="tl">'+steps+'</div></div>';

function renderContacts(){
  const rows=TOURNAMENT.contacts.map(c=>'<div class="contact"><span class="ci">'+c.initial+'</span><div class="cn"><div class="cnm">'+c.name+'</div><div class="crl">'+c.role+'</div></div>'+(c.phone?'<a href="tel:'+c.phone+'">Call</a>':(c.url?'<a href="'+c.url+'" target="_blank" rel="noopener">Open</a>':''))+'</div>').join('');

}
function renderRules(){
  const quick=TOURNAMENT.rules.quick.map(q=>'<div class="qr"><div class="qrv num">'+q.v+'</div><div class="qrl">'+q.l+'</div></div>').join('');
  const full=TOURNAMENT.rules.full.map(r=>'<div class="ruleline"><b>'+r.k+'</b><span>'+r.v+'</span></div>').join('');

function renderChanges(){
  const rows=TOURNAMENT.changes.map(c=>'<p style="margin:0 0 6px"><b>'+c.k+':</b> '+c.v+'</p>').join('');
  document.getElementById('changesSection').innerHTML='<div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>What Changed · '+TOURNAMENT.tournament.updatesUpdated+'</div><div class="card" style="font-size:13px">'+rows+'</div>';

const fg=document.getElementById('fullGuideLink');
fg.href=TOURNAMENT.tournament.fullGuideUrl;
document.getElementById('fg1').textContent='Full '+TOURNAMENT.tournament.name+' Guide';
document.getElementById('fg2').textContent='Everything in one detailed document — hotel, travel scenarios, full rules, itinerary.';

// ---- PACKING ----
const LISTS=TOURNAMENT.packing.groups;
const LS='gd-pack-'+TOURNAMENT.tournament.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
document.getElementById('packAlert').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span><b>'+TOURNAMENT.packing.alert+'</b></span>';
function loadPack(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function savePack(o){localStorage.setItem(LS,JSON.stringify(o));}
function renderPack(){
  const pack=loadPack();const wrap=document.getElementById('packLists');
  let html='',total=0,done=0;
  for(const [grp,items] of Object.entries(LISTS)){
    html+='<div class="chkgrp"><h4>'+grp+'</h4>';
    items.forEach(([name,sub])=>{
      const id=grp+'::'+name;const checked=!!pack[id];if(checked)done++;total++;
      html+='<div class="chk '+(checked?'done':'')+'" onclick="tog(\''+id.replace(/'/g,"\\'")+'\',this)"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span><span class="chkname">'+name+(sub?' <span class="muted small">('+sub+')</span>':'')+'</span></div>';
    });
    html+='</div>';
  }
  wrap.innerHTML=html;
  document.getElementById('packCount').textContent=done+' of '+total;
  document.getElementById('packBar').style.width=(total?Math.round(done/total*100):0)+'%';
}
function tog(id,el){const pack=loadPack();pack[id]=!pack[id];savePack(pack);el.classList.toggle('done',!!pack[id]);renderPack();}
function resetPack(){if(confirm('Reset the packing checklist?')){localStorage.removeItem(LS);renderPack();}}

// ---- INIT + LIVE TICK ----
renderSchedule();renderVenue();renderBreak();renderNearby();renderContacts();renderRules();renderChanges();renderWeather();renderNextMatch();renderCountdown();refreshContext();renderPack();
setInterval(()=>{renderCountdown();refreshContext();},1000);
</script>
